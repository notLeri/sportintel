# Local environment. Database only:   docker compose -f deploy/compose.local.yml up -d db
# The whole app (image):              docker compose -f deploy/compose.local.yml --profile full up --build
# Local LLM (ADR-004):                 docker compose -f deploy/compose.local.yml --profile llm up -d ollama
name: sportintel

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: sportintel:local
  env_file: ../.env
  environment:
    # Inside a container the database is reached by service name, not localhost from .env.
    DATABASE_URL: postgresql+psycopg://sportintel:sportintel@db:5432/sportintel
    DATABASE_URL_MIGRATOR: postgresql+psycopg://sportintel:sportintel@db:5432/sportintel
    STATIC_DIR: /app/static
    # localhost from .env means the container itself; the host's Ollama (or the llm profile) is here.
    OLLAMA_URL: http://host.docker.internal:11434
  extra_hosts: ["host.docker.internal:host-gateway"]  # Linux; Docker Desktop knows the name already
  read_only: true
  tmpfs: [/tmp]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sportintel
      POSTGRES_PASSWORD: sportintel
      POSTGRES_DB: sportintel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportintel -d sportintel"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    profiles: [full]
    command: migrate
    restart: "no"

  web:
    <<: *app
    profiles: [full]
    command: web
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    profiles: [full]
    command: worker
    environment:
      DATABASE_URL: postgresql+psycopg://sportintel:sportintel@db:5432/sportintel
      STATIC_DIR: /app/static
      OLLAMA_URL: http://host.docker.internal:11434
      PORT: "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ADR-004: optional local LLM. Models: make llm-pull. ~8 GB RAM for a 7B q4.
  ollama:
    image: ollama/ollama
    profiles: [llm]
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]

volumes:
  pgdata:
  ollama_models:
